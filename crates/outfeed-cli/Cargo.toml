[package]
name = "outfeed-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface and release gate automation for outfeed"

[lints]
workspace = true

[[bin]]
name = "outfeed"
path = "src/main.rs"

[dependencies]
outfeed-core = { path = "../outfeed-core", version = "0.1.0-beta.6" }
outfeed-mcp = { path = "../outfeed-mcp", version = "0.1.0-beta.6" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"


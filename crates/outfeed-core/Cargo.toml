[package]
name = "outfeed-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core release engine, conventional commit parser, SemVer calculator, and toml_edit manifest synchronizer"

[lints]
workspace = true

[dependencies]
storypole-core = "0.1.0-beta.2"
sawhorse-core = "0.1.0-beta.2"

chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "rt", "macros"] }
toml = "1.1"
toml_edit = "0.22"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"


[package]
name = "outfeed-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core release engine, conventional commit parser, SemVer calculator, and toml_edit manifest synchronizer"

[lints]
workspace = true

[dependencies]
gaugeblock-git = "0.1.0-beta.1"
# Shared wire contracts; resolved locally through the meta-harness [patch.crates-io] mapping.
gaugeblock-contracts = "0.1.0-beta.1"
storypole-core = "0.1.0-beta.2"
sawhorse-core = "0.1.0-beta.2"

chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Sparse-index polling and registry lookups. Already in the build graph through `sawhorse-core`,
# so the blocking client adds no new transitive compilation.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Trace ids for the gate's children (GB-243). v4 because a gate run started by hand has no ambient
# trace to inherit, and those are exactly the runs worth timing.
uuid = { version = "1", features = ["v4"] }
semver = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "rt", "macros", "time"] }
toml = "1.1"
toml_edit = "0.22"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"


[package]
name = "outfeed-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol (MCP) server for outfeed"

[lints]
workspace = true

[dependencies]
outfeed-core = { path = "../outfeed-core", version = "0.1.0-beta.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt", "macros", "io-util", "sync"] }
tracing = "0.1"

